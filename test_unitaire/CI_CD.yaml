# ════════════════════════════════════════════════════════════════════════
# GitHub Actions CI/CD - SAVIA-LLM
# Tests automatiques sur chaque push et pull request
# ════════════════════════════════════════════════════════════════════════

name: SAVIA-LLM CI/CD Tests

# Déclencheurs
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Permet de lancer manuellement

# Variables d'environnement
env:
  PYTHON_VERSION: '3.10'

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # JOB 1 : TESTS UNITAIRES
  # ══════════════════════════════════════════════════════════════════════
  unit-tests:
    name: 🧪 Tests Unitaires
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🧪 Run unit tests
        run: |
          pytest tests/test_unit_*.py -v --tb=short --junitxml=junit/unit-test-results.xml
      
      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: junit/unit-test-results.xml

  # ══════════════════════════════════════════════════════════════════════
  # JOB 2 : TESTS D'INTÉGRATION
  # ══════════════════════════════════════════════════════════════════════
  integration-tests:
    name: 🔗 Tests d'Intégration
    runs-on: ubuntu-latest
    needs: unit-tests  # Attend que tests unitaires passent
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🔗 Run integration tests
        run: |
          pytest tests/test_integration.py -v --tb=short --junitxml=junit/integration-test-results.xml
      
      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: junit/integration-test-results.xml

  # ══════════════════════════════════════════════════════════════════════
  # JOB 3 : TESTS DE PERFORMANCE
  # ══════════════════════════════════════════════════════════════════════
  performance-tests:
    name: ⚡ Tests de Performance
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: ⚡ Run performance tests
        run: |
          pytest tests/test_performance.py -v --tb=short --junitxml=junit/performance-test-results.xml
      
      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-results
          path: junit/performance-test-results.xml

  # ══════════════════════════════════════════════════════════════════════
  # JOB 4 : TESTS QUALITÉ DONNÉES
  # ══════════════════════════════════════════════════════════════════════
  quality-tests:
    name: 📊 Tests Qualité Données
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 📊 Run quality tests
        run: |
          pytest tests/test_quality.py -v --tb=short --junitxml=junit/quality-test-results.xml
      
      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-test-results
          path: junit/quality-test-results.xml

  # ══════════════════════════════════════════════════════════════════════
  # JOB 5 : COUVERTURE DE CODE
  # ══════════════════════════════════════════════════════════════════════
  coverage:
    name: 📈 Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, performance-tests, quality-tests]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 📈 Generate coverage report
        run: |
          pytest tests/ --cov=src --cov-report=xml --cov-report=html --cov-report=term
      
      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-savia-llm
          fail_ci_if_error: false
      
      - name: 📊 Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # ══════════════════════════════════════════════════════════════════════
  # JOB 6 : QUALITY CHECKS (Linting)
  # ══════════════════════════════════════════════════════════════════════
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black
      
      - name: 🔍 Lint with flake8
        run: |
          # Stop build si erreurs Python syntax ou noms non définis
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings sur complexité et style
          flake8 src/ --count --max-complexity=10 --max-line-length=120 --statistics
        continue-on-error: true
      
      - name: 🎨 Check formatting with black
        run: |
          black --check src/ tests/
        continue-on-error: true

  # ══════════════════════════════════════════════════════════════════════
  # JOB 7 : RAPPORT FINAL
  # ══════════════════════════════════════════════════════════════════════
  report:
    name: 📄 Generate Final Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, performance-tests, quality-tests, coverage]
    if: always()
    
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: 📄 Generate summary
        run: |
          echo "# 📊 SAVIA-LLM Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Performance Tests: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Quality Tests: ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📈 Coverage" >> $GITHUB_STEP_SUMMARY
          echo "See artifacts for detailed reports" >> $GITHUB_STEP_SUMMARY